[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyncrmentl"
version = "0.0.1"
description = "A Python library for making basic (and complex) incremental games."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hakan Javed", email = "hakanjaved@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com"
Issues = "https://github.com/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pyncrmentl"]

[tool.ruff]
line-length = 88